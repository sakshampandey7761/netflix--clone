<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Netflix Clone</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; height:100vh; font-family: Arial, sans-serif; background:#141414; color:#fff; }
        .login-card{ background:#222; padding:24px; border-radius:8px; width:320px; box-shadow:0 6px 18px rgba(0,0,0,0.6);} 
        .login-card h2{ margin:0 0 16px 0; font-size:20px; }
        .login-card input{ width:100%; padding:10px; margin:8px 0; border-radius:4px; border:1px solid #333; background:#111; color:#fff }
        .btn{ display:inline-block; padding:10px 14px; border-radius:4px; background:#e50914; color:#fff; border:none; cursor:pointer; width:100%; }
        .muted{ color:#aaa; font-size:13px; text-align:center; margin-top:12px }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Sign In</h2>
        <form id="login-form">
            <input id="username" name="username" placeholder="Username" autocomplete="username" required>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button class="btn" type="submit">Sign In</button>
        </form>
        <div class="muted">Use any non-empty credentials to sign in for this demo.</div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e){
            e.preventDefault();
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value.trim();
            if(!u || !p){
                alert('Please enter username and password.');
                return;
            }
            // For this mini-project demo we'll accept any non-empty credentials.
            localStorage.setItem('auth','1');
            localStorage.setItem('username', u);
            // Redirect to main page
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
